<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="Request path inside India: users reach one server in AWS Mumbai over HTTPS; each request passes portal routing, the session check and the policy layer before domain services and Prisma reach PostgreSQL on the same server; files and nightly backups live in Amazon S3 Mumbai, reached through links the app signs after a permission check; a background worker sends email through Amazon SES Mumbai and encrypted push notifications to phones." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" color="#1f2933">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="530" fill="#ffffff"/>

  <!-- Region and server boundaries -->
  <rect x="222" y="44" width="730" height="418" rx="14" fill="#d97706" fill-opacity="0.05" stroke="#d97706" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="238" y="64" font-weight="700" fill="#b45309">Stays in India: AWS Mumbai region</text>
  <rect x="238" y="76" width="496" height="372" rx="12" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="254" y="96" font-weight="600" fill="currentColor">One server (Docker Compose)</text>

  <!-- Users -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.55">
    <rect x="20" y="100" width="180" height="46" rx="8"/>
    <rect x="20" y="164" width="180" height="46" rx="8"/>
    <rect x="20" y="228" width="180" height="46" rx="8"/>
    <rect x="20" y="292" width="180" height="46" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="110" y="120" font-weight="600">Owners &amp; accountant</text>
    <text x="110" y="136" font-size="11" fill-opacity="0.7">desktop or phone</text>
    <text x="110" y="184" font-weight="600">Event managers</text>
    <text x="110" y="200" font-size="11" fill-opacity="0.7">desktop or phone</text>
    <text x="110" y="248" font-weight="600">Supervisors &amp; crew</text>
    <text x="110" y="264" font-size="11" fill-opacity="0.7">app on their phone</text>
    <text x="110" y="312" font-weight="600">Vendors</text>
    <text x="110" y="328" font-size="11" fill-opacity="0.7">phone or desktop</text>
    <text x="110" y="370" font-size="11" fill-opacity="0.7">every request: HTTPS +</text>
    <text x="110" y="384" font-size="11" fill-opacity="0.7">secure session cookie</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="200" y1="123" x2="252" y2="123"/>
    <line x1="200" y1="187" x2="252" y2="187"/>
    <line x1="200" y1="251" x2="252" y2="251"/>
    <line x1="200" y1="315" x2="252" y2="315"/>
  </g>

  <!-- App -->
  <rect x="254" y="106" width="464" height="238" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.8"/>
  <text x="486" y="124" text-anchor="middle" font-weight="700" fill="currentColor">Next.js application</text>
  <g fill="none" stroke="currentColor" stroke-opacity="0.55">
    <rect x="272" y="134" width="428" height="34" rx="6"/>
    <rect x="272" y="176" width="428" height="34" rx="6"/>
    <rect x="272" y="260" width="428" height="34" rx="6"/>
    <rect x="272" y="302" width="428" height="34" rx="6"/>
  </g>
  <rect x="272" y="218" width="428" height="34" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.8"/>
  <g fill="currentColor" text-anchor="middle">
    <text x="486" y="155">Routing: internal app · vendor portal · crew app</text>
    <text x="486" y="197">Session check (Better Auth, sessions stored in DB)</text>
    <text x="486" y="239" font-weight="700">Policy layer: role + assigned scope + field filter</text>
    <text x="486" y="281">Domain services: Zod validation, transactions, audit</text>
    <text x="486" y="323">Prisma ORM</text>
  </g>
  <g stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="486" y1="168" x2="486" y2="174"/>
    <line x1="486" y1="210" x2="486" y2="216"/>
    <line x1="486" y1="252" x2="486" y2="258"/>
    <line x1="486" y1="294" x2="486" y2="300"/>
  </g>

  <!-- Database and worker on the same server -->
  <rect x="254" y="362" width="200" height="72" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="354" y="388" text-anchor="middle" font-weight="700" fill="currentColor">PostgreSQL</text>
  <text x="354" y="405" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">business data · audit log</text>
  <text x="354" y="419" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">job queue</text>
  <line x1="354" y1="336" x2="354" y2="360" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="362" y="352" font-size="11" fill="currentColor">SQL</text>
  <rect x="518" y="362" width="200" height="72" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="618" y="391" text-anchor="middle" font-weight="600" fill="currentColor">Background worker</text>
  <text x="618" y="408" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">reminders · PDFs · exports</text>
  <line x1="454" y1="398" x2="516" y2="398" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="485" y="391" text-anchor="middle" font-size="11" fill="currentColor">jobs</text>

  <!-- Storage -->
  <rect x="752" y="106" width="186" height="64" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="845" y="129" text-anchor="middle" font-weight="600" fill="currentColor">Amazon S3 (Mumbai)</text>
  <text x="845" y="146" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">private files</text>
  <text x="845" y="161" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">nightly DB backups</text>
  <polyline points="700,235 742,235 742,138 750,138" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="752" y="196" font-size="11" fill="currentColor">signs file links after</text>
  <text x="752" y="210" font-size="11" fill="currentColor">a permission check</text>
  <polyline points="110,100 110,24 845,24 845,104" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="480" y="17" text-anchor="middle" font-size="11" fill="currentColor">browser uploads and downloads files directly with the signed link</text>

  <!-- Email -->
  <rect x="752" y="372" width="186" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="845" y="394" text-anchor="middle" font-weight="600" fill="currentColor">Amazon SES email</text>
  <text x="845" y="410" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity="0.7">Mumbai</text>
  <line x1="718" y1="398" x2="750" y2="398" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Push leaves the region, encrypted -->
  <rect x="518" y="480" width="200" height="40" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.55"/>
  <text x="618" y="505" text-anchor="middle" fill="currentColor">Push to phones</text>
  <line x1="618" y1="434" x2="618" y2="478" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="608" y="474" text-anchor="end" font-size="11" fill="currentColor">encrypted, no business details</text>
</svg>
