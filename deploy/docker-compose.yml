# Taamara Taamara on one server in AWS Mumbai (Phase 10, D5): the app, PostgreSQL 16 and Caddy
# (automatic HTTPS). Files go to S3 Mumbai; the database stays on this server's disk and is backed
# up nightly to S3 (deploy/backup-to-s3.sh). See docs/DEPLOYMENT.md.
#
#   cd deploy && cp env.production.example .env && (fill it in) && docker compose up -d --build
name: taamara

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: taamara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: taamara
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taamara -d taamara"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: taamara-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taamara:${POSTGRES_PASSWORD}@db:5432/taamara?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploads in progress (and every file, if STORAGE_DRIVER=local).
      - storage:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db:
  storage:
  caddy_data:
  caddy_config:
